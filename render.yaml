# Render: API (NestJS + Socket.IO + очередь BullMQ + Telegram в одном процессе) и Redis.
# Сайт (Next.js) — на Vercel. Секреты не хранятся в репозитории:
# QR_SIGNING_SECRET и JWT_SECRET генерирует Render, SEED_PIN задаётся при создании.
services:
  - type: web
    name: foodbuy-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/web/**
    envVars:
      # Общая бесплатная база проекта autokg, таблицы foodbuy — в своей схеме
      - key: DATABASE_URL
        fromDatabase:
          name: autokg
          property: connectionString
      - key: DATABASE_SCHEMA
        value: foodbuy
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: foodbuy-redis
          property: connectionString
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Демо-ресторан при первом запуске; PIN сотрудников и супер-админа — секретный
      - key: SEED_DEMO
        value: "true"
      - key: SEED_PIN
        sync: false
      # Бесплатный тариф: диск не сохраняется между перезапусками — для фото нужен S3
      - key: STORAGE_DRIVER
        value: local

  - type: keyvalue
    name: foodbuy-redis
    plan: free
    region: oregon
    # BullMQ требует, чтобы Redis не выбрасывал ключи
    maxmemoryPolicy: noeviction
    ipAllowList: []
